{{- if .Values.operator }}
{{- $authToken := .Values.operator.options.authToken }}
{{- $annotations := default dict .Values.operator.pod.annotations }}
{{- if $authToken }}
{{- $annotations = merge (dict "checksum/auth-token" ($authToken | sha256sum)) $annotations }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lobster-operator
  namespace: {{ .Values.namespace }}
  labels:
    app: lobster-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lobster-operator
  template:
    metadata:
      labels:
        purpose: logging
        app: lobster-operator
      annotations: {{ $annotations | toYaml | nindent 8 }}
    spec:
      {{- if .Values.operator.pod.priorityClassName }}
      priorityClassName: {{ .Values.operator.pod.priorityClassName }}
      {{- else if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName }}
      {{- end }}
      affinity: {{ (default dict .Values.operator.pod.affinity) | toYaml | nindent 8 }}
      serviceAccountName: lobster-operator
      containers:
        - name: operator
          image: {{ required "this value is required" .Values.registry }}/lobster-operator:{{ .Chart.AppVersion }}
          imagePullPolicy: Always
          args:
          - --zap-log-level=info
          - --addr=:{{ .Values.operator.options.serverPort }}
          - --maxSinkRule={{ .Values.operator.options.maxSinkRule }}
          {{- if $authToken }}
          - --sync.authTokenFile=/etc/lobster/auth-token/token
          {{- end }}
          {{- if .Values.operator.options.extraArgs }}
          {{- .Values.operator.options.extraArgs | toYaml | nindent 10 }}
          {{- end }}
          {{- if $authToken }}
          volumeMounts:
            - name: auth-token
              mountPath: /etc/lobster/auth-token
              readOnly: true
          {{- end }}
          ports:
            - name: http-metrics
              containerPort: {{ .Values.operator.options.metricPort }}
              protocol: TCP
            - name: http-probe
              containerPort: {{ .Values.operator.options.probePort }}
              protocol: TCP
            - name: http
              containerPort: {{ .Values.operator.options.serverPort }}
              protocol: TCP
          resources: {{ (default dict .Values.operator.container.resources) | toYaml | nindent 12 }}
      tolerations: {{ (default list .Values.operator.pod.tolerations) | toYaml | nindent 8 }}
      {{- if $authToken }}
      volumes:
        - name: auth-token
          secret:
            secretName: lobster-operator-auth-token
      {{- end }}
{{- end }}